[package]
name = "hastra-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: the harness loads the compiled programs (../target/deploy) and their IDLs
# (../target/idl) at runtime and never links the program crates.
[workspace]

[[bin]]
name = "fuzz_vault"
path = "fuzz_vault/test_fuzz.rs"

[dependencies]
trident-fuzz = { version = "0.12.0", features = ["token"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
overflow-checks = true
debug-assertions = true
