name: Nightly deep fuzz

# Deep profile of the Trident harness: a fresh random master seed each run, many more iterations
# and longer flow sequences than the fast profile in Program CI. The output (log, metrics with the
# master seed, failing iterations with replay seeds) is uploaded on every run.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_DNA: 1

jobs:
  fuzz-deep:
    name: fuzz (deep)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libudev-dev \
          llvm \
          libclang-dev \
          protobuf-compiler \
          libssl-dev

    - uses: solana-foundation/github-actions/extract-versions@v0.2.11
      id: versions

    - uses: solana-foundation/github-actions/setup-all@v0.2.11
      with:
        solana_version: ${{ steps.versions.outputs.solana_version }}
        anchor_version: ${{ steps.versions.outputs.anchor_version }}

    - name: Cache Cargo registry, git sources and harness build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          trident-tests/target
        key: fuzz-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: fuzz-${{ runner.os }}-

    - name: Install localnet deploy keypairs
      run: bash scripts/sync-localnet-deploy-keypairs.sh

    - name: Install SBF platform tools
      run: cargo build-sbf --force-tools-install --manifest-path programs/vault-mint/Cargo.toml

    - name: Anchor build (testing)
      run: anchor build -- --features testing

    - name: Conversion properties, deep profile
      env:
        PROPTEST_CASES: 100000
      run: cargo test --release --manifest-path trident-tests/Cargo.toml --test conversions

    - name: Deep fuzz profile
      if: success() || failure()
      run: trident-tests/run_fuzz.sh 120000 200 fuzz-out

    - name: Upload fuzz output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-deep-${{ github.run_id }}
        retention-days: 14
        if-no-files-found: error
        path: fuzz-out/
