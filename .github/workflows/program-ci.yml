name: Program CI

# Tests and reproducible builds use the same pipeline for every supported event.
# Version tags additionally publish the verified build tree as a zipped draft release asset.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NO_DNA: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libudev-dev \
          llvm \
          libclang-dev \
          protobuf-compiler \
          libssl-dev

    - uses: solana-foundation/github-actions/extract-versions@v0.2.11
      id: versions

    - uses: solana-foundation/github-actions/setup-all@v0.2.11
      with:
        solana_version: ${{ steps.versions.outputs.solana_version }}
        anchor_version: ${{ steps.versions.outputs.anchor_version }}

    - name: Cache Cargo registry and git sources
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-

    - name: Cache yarn dependencies
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: yarn

    - name: Install yarn dependencies
      run: yarn install --frozen-lockfile

    # Ensure SBF platform tools exist before Anchor invokes cargo-build-sbf.
    - name: Install SBF platform tools
      run: cargo build-sbf --force-tools-install --manifest-path programs/vault-mint/Cargo.toml

    # Anchor 0.31.1 rewrites declare_id! on the first build when target/deploy
    # is absent. Create it first so tests run against the production program IDs.
    - name: Anchor build (testing)
      run: |
        mkdir -p target/deploy
        anchor build -- --features testing

    - name: Confirm build preserved checked-in IDs
      run: |
        git diff --exit-code -- \
          Anchor.toml \
          programs/vault-mint/src/lib.rs \
          programs/vault-stake/src/lib.rs

    # Programs are loaded at genesis at their production IDs, upgradeable by this wallet.
    - name: Start local validator
      run: |
        mkdir -p ~/.config/solana/
        solana-keygen new --no-passphrase --outfile ~/.config/solana/hastra-localnet-id.json
        solana config set --url localhost
        solana config set --keypair ~/.config/solana/hastra-localnet-id.json

        bash scripts/localnet-validator.sh --reset > /tmp/validator.log 2>&1 &
        echo "VALIDATOR_PID=$!" >> "$GITHUB_ENV"
        for _ in $(seq 1 60); do
          solana cluster-version >/dev/null 2>&1 && break
          sleep 1
        done
        solana cluster-version || { cat /tmp/validator.log; exit 1; }
        solana airdrop 1000

    - name: Run Anchor tests
      run: anchor test --skip-local-validator --skip-build --skip-deploy

    - name: Stop local validator
      if: always()
      run: kill "${VALIDATOR_PID}" 2>/dev/null || true

  # One runner per program id. Stake builds all write target/deploy/vault_stake.so,
  # so they cannot share a checkout.
  verified-build:
    name: verified-build (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mint
            library: vault_mint
            program: vault-mint
            so_name: vault_mint.so
            idl_name: vault_mint.json
            ts_name: vault_mint.ts
            address: 9WUyNREiPDMgwMh5Gt81Fd3JpiCKxpjZ5Dpq9Bo1RhMV
            cargo_args: ""
            desc: "Solana Vault Mint Contract for Hastra"
          - id: prime
            library: vault_stake
            program: vault-stake
            so_name: vault_stake_prime.so
            idl_name: vault_stake_prime.json
            ts_name: vault_stake_prime.ts
            address: 97V7JsExNC6yFWu5KjK1FLfVkNVvtMpAFL5QkLWKEGxY
            cargo_args: ""
            desc: "Solana Vault Stake Contract for Hastra (PRIME)"
          - id: auto
            library: vault_stake
            program: vault-stake
            so_name: vault_stake_auto.so
            idl_name: vault_stake_auto.json
            ts_name: vault_stake_auto.ts
            address: 5uJgCDrQHfA58fPqLsuU14Srg9quxXNHz91cZ54cq4pK
            cargo_args: "--no-default-features --features pool-auto"
            desc: "Solana Vault Stake Contract for Hastra (AUTO)"
          - id: auto-devnet
            library: vault_stake
            program: vault-stake
            so_name: vault_stake_auto_devnet.so
            idl_name: vault_stake_auto_devnet.json
            ts_name: vault_stake_auto_devnet.ts
            address: B8FDo5EGA2hZ7YMugcw8wPHUYDBQJfNkEYpduXFLHfdZ
            cargo_args: "--no-default-features --features pool-auto-devnet"
            desc: "Solana Vault Stake Contract for Hastra (AUTO devnet)"
          - id: smb
            library: vault_stake
            program: vault-stake
            so_name: vault_stake_smb.so
            idl_name: vault_stake_smb.json
            ts_name: vault_stake_smb.ts
            address: FtpEAgur3VALsDw91PfNre82eXVrtgiDNf9EG3JeBd2r
            cargo_args: "--no-default-features --features pool-smb"
            desc: "Solana Vault Stake Contract for Hastra (SMB)"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load verify config
      run: cat .github/verify-config.env >> "$GITHUB_ENV"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libudev-dev \
          llvm \
          libclang-dev \
          protobuf-compiler \
          libssl-dev

    - uses: solana-foundation/github-actions/extract-versions@v0.2.11
      id: versions

    - uses: solana-foundation/github-actions/setup-all@v0.2.11
      with:
        solana_version: ${{ steps.versions.outputs.solana_version }}
        anchor_version: ${{ steps.versions.outputs.anchor_version }}
        verify_version: ${{ env.SOLANA_VERIFY_VERSION }}

    - name: Cache Cargo registry and git sources
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-

    # Anchor 0.31.1 rewrites declare_id! on the first build when target/deploy
    # is absent. Create it first so this production checkout stays immutable.
    - name: Build IDL and TypeScript types
      env:
        PROGRAM: ${{ matrix.program }}
        IDL_NAME: ${{ matrix.idl_name }}
        TS_NAME: ${{ matrix.ts_name }}
        CARGO_ARGS: ${{ matrix.cargo_args }}
      run: |
        mkdir -p target/deploy artifacts/programs artifacts/idl artifacts/client
        idl_args=(-p "${PROGRAM}" -o "artifacts/idl/${IDL_NAME}" -t "artifacts/client/${TS_NAME}")
        if [ -n "${CARGO_ARGS}" ]; then
          # shellcheck disable=SC2086
          anchor idl build "${idl_args[@]}" -- ${CARGO_ARGS}
        else
          anchor idl build "${idl_args[@]}"
        fi

    - name: Confirm IDL address
      env:
        IDL_PATH: artifacts/idl/${{ matrix.idl_name }}
        EXPECTED_ADDRESS: ${{ matrix.address }}
      run: |
        python3 -c 'import json, os, sys
        path = os.environ["IDL_PATH"]
        expected = os.environ["EXPECTED_ADDRESS"]
        address = json.load(open(path))["address"]
        if address != expected:
            sys.exit(f"{path} address {address} != {expected}")
        print(f"{path} address {address}")'

    # Cargo package description is static, so every stake IDL would otherwise
    # share one sentence. Replace that field only; leave the rest of the file.
    - name: Set IDL description
      env:
        IDL_PATH: artifacts/idl/${{ matrix.idl_name }}
        TS_PATH: artifacts/client/${{ matrix.ts_name }}
        DESC: ${{ matrix.desc }}
      run: |
        python3 << 'PY'
        import json
        import os
        import sys

        idl_path = os.environ["IDL_PATH"]
        ts_path = os.environ["TS_PATH"]
        new_desc = os.environ["DESC"]

        idl_text = open(idl_path).read()
        current = json.loads(idl_text)["metadata"]["description"]
        if current == new_desc:
            print(f"description already {new_desc!r}")
            sys.exit(0)
        field = '"description": ' + json.dumps(current)
        updated = '"description": ' + json.dumps(new_desc)

        def replace_once(path, text):
            count = text.count(field)
            if count != 1:
                sys.exit(f"{path} description field count {count}, expected 1")
            open(path, "w").write(text.replace(field, updated, 1))
            print(f"{path} description {current!r} -> {new_desc!r}")

        replace_once(idl_path, idl_text)
        replace_once(ts_path, open(ts_path).read())
        PY

    - name: Confirm build preserved checked-in IDs
      run: |
        git diff --exit-code -- \
          Anchor.toml \
          programs/vault-mint/src/lib.rs \
          programs/vault-stake/src/lib.rs

    - name: Verifiable build
      env:
        LIBRARY: ${{ matrix.library }}
        SO_NAME: ${{ matrix.so_name }}
        CARGO_ARGS: ${{ matrix.cargo_args }}
      run: |
        if [ -n "${CARGO_ARGS}" ]; then
          # shellcheck disable=SC2086
          solana-verify build --library-name "${LIBRARY}" -- ${CARGO_ARGS}
        else
          solana-verify build --library-name "${LIBRARY}"
        fi
        cp "target/deploy/${LIBRARY}.so" "artifacts/programs/${SO_NAME}"

    - name: Upload program artifact
      uses: actions/upload-artifact@v4
      with:
        name: verified-${{ matrix.id }}-${{ github.sha }}
        retention-days: 30
        path: |
          artifacts/programs/${{ matrix.so_name }}
          artifacts/idl/${{ matrix.idl_name }}
          artifacts/client/${{ matrix.ts_name }}

  assemble:
    needs: [test, verified-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mint_hash: ${{ steps.checksums.outputs.mint_hash }}
      stake_prime_hash: ${{ steps.checksums.outputs.stake_prime_hash }}
      stake_auto_hash: ${{ steps.checksums.outputs.stake_auto_hash }}
      stake_auto_devnet_hash: ${{ steps.checksums.outputs.stake_auto_devnet_hash }}
      stake_smb_hash: ${{ steps.checksums.outputs.stake_smb_hash }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Load verify config
      run: cat .github/verify-config.env >> "$GITHUB_ENV"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libudev-dev \
          llvm \
          libclang-dev \
          protobuf-compiler \
          libssl-dev

    - uses: solana-foundation/github-actions/extract-versions@v0.2.11
      id: versions

    - uses: solana-foundation/github-actions/setup-all@v0.2.11
      with:
        solana_version: ${{ steps.versions.outputs.solana_version }}
        anchor_version: ${{ steps.versions.outputs.anchor_version }}
        verify_version: ${{ env.SOLANA_VERIFY_VERSION }}

    - name: Cache yarn dependencies
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: yarn

    - name: Install yarn dependencies
      run: yarn install --frozen-lockfile

    - name: Download verified program artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: verified-{mint,prime,auto,auto-devnet,smb}-${{ github.sha }}
        merge-multiple: true
        path: artifacts

    # Pull-request commits can be synthetic merge refs, so only persistent refs
    # export remote verification transactions.
    - name: Export verify PDA transactions (devnet + mainnet)
      if: github.event_name != 'pull_request'
      run: |
        chmod +x .github/scripts/export_verify_pda_txs_ci.sh .github/scripts/pda_tx_to_msg.mjs
        .github/scripts/export_verify_pda_txs_ci.sh artifacts

    - name: Generate checksums
      id: checksums
      run: |
        (
          cd artifacts
          sha256sum \
            programs/vault_mint.so \
            programs/vault_stake_prime.so \
            programs/vault_stake_auto.so \
            programs/vault_stake_auto_devnet.so \
            programs/vault_stake_smb.so \
            idl/vault_mint.json \
            idl/vault_stake_prime.json \
            idl/vault_stake_auto.json \
            idl/vault_stake_auto_devnet.json \
            idl/vault_stake_smb.json \
            client/vault_mint.ts \
            client/vault_stake_prime.ts \
            client/vault_stake_auto.ts \
            client/vault_stake_auto_devnet.ts \
            client/vault_stake_smb.ts \
            > checksums.txt
          if compgen -G 'verify/pda-*.txt' > /dev/null; then
            sha256sum verify/pda-*.txt >> checksums.txt
          fi
          cat checksums.txt
        )

        echo "mint_hash=$(sha256sum artifacts/programs/vault_mint.so | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "stake_prime_hash=$(sha256sum artifacts/programs/vault_stake_prime.so | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "stake_auto_hash=$(sha256sum artifacts/programs/vault_stake_auto.so | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "stake_auto_devnet_hash=$(sha256sum artifacts/programs/vault_stake_auto_devnet.so | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "stake_smb_hash=$(sha256sum artifacts/programs/vault_stake_smb.so | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Upload verified program artifacts
      uses: actions/upload-artifact@v4
      with:
        name: verified-program-builds-${{ github.sha }}
        retention-days: 30
        path: |
          artifacts/programs/
          artifacts/idl/
          artifacts/client/
          artifacts/verify/
          artifacts/checksums.txt

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Download verified program artifacts
      uses: actions/download-artifact@v4
      with:
        name: verified-program-builds-${{ github.sha }}
        path: artifacts

    # GitHub Release assets are basename-only, so ship one zip that preserves
    # the same programs/ idl/ client/ verify/ layout as the CI artifact.
    - name: Package release archive
      run: |
        ARCHIVE="hastra-sol-vault-${{ github.ref_name }}.zip"
        (cd artifacts && zip -r "../${ARCHIVE}" .)
        ls -la "${ARCHIVE}"
        echo "RELEASE_ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

    - name: Create draft GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: true
        files: ${{ env.RELEASE_ARCHIVE }}
        body: |
          ## Program Artifacts — ${{ github.ref_name }}

          Built with [solana-verify](https://solana.com/docs/programs/verified-builds) from commit `${{ github.sha }}`.

          Download `hastra-sol-vault-${{ github.ref_name }}.zip` — it preserves the same layout as the CI artifact:

          ```text
          programs/   *.so
          idl/        *.json
          client/     *.ts
          verify/     pda-tx-*.txt (full tx) + pda-msg-*.txt (Squads import)
          checksums.txt
          ```

          ### Programs (verified)

          Mint, PRIME, and SMB each have one binary used on both clusters. AUTO program ids differ, so devnet and mainnet are separate files.

          | File | Cluster | SHA-256 |
          |------|---------|---------|
          | `programs/vault_mint.so` | devnet and mainnet | `${{ needs.assemble.outputs.mint_hash }}` |
          | `programs/vault_stake_prime.so` | devnet and mainnet | `${{ needs.assemble.outputs.stake_prime_hash }}` |
          | `programs/vault_stake_auto.so` | mainnet | `${{ needs.assemble.outputs.stake_auto_hash }}` |
          | `programs/vault_stake_auto_devnet.so` | devnet | `${{ needs.assemble.outputs.stake_auto_devnet_hash }}` |
          | `programs/vault_stake_smb.so` | devnet and mainnet | `${{ needs.assemble.outputs.stake_smb_hash }}` |

          Devnet AUTO upgrades use `programs/vault_stake_auto_devnet.so` with `verify/pda-msg-devnet-vault_stake_auto.txt`.

          ### Squads verify PDA

          After the program upgrade executes, import the cluster-matching **`pda-msg-*`** file (message-only base58) in Squads v4 Transaction Builder (`backup.app.squads.so` / `app.squads.so`). The `pda-tx-*` files are the full transaction encoding from `solana-verify export-pda-tx`. See [verified builds — multisig](https://solana.com/docs/programs/verified-builds#how-to-verify-your-program-when-its-controlled-by-a-multisig-like-squads).

          | Cluster | vault-mint | vault-stake PRIME | vault-stake AUTO | vault-stake SMB |
          |---------|------------|-------------------|------------------|-----------------|
          | Devnet | `verify/pda-msg-devnet-vault_mint.txt` | `verify/pda-msg-devnet-vault_stake_prime.txt` | `verify/pda-msg-devnet-vault_stake_auto.txt` | `verify/pda-msg-devnet-vault_stake_smb.txt` |
          | Mainnet | `verify/pda-msg-mainnet-vault_mint.txt` | `verify/pda-msg-mainnet-vault_stake_prime.txt` | `verify/pda-msg-mainnet-vault_stake_auto.txt` | `verify/pda-msg-mainnet-vault_stake_smb.txt` |

          Then run `solana-verify remote submit-job` per program with `--uploader` set to that cluster's Squads vault PDA (on-chain upgrade authority).

          ### Interface (IDL + TypeScript types)

          | File | Description |
          |------|-------------|
          | `idl/vault_mint.json` | Anchor IDL for vault-mint |
          | `idl/vault_stake_prime.json` | Anchor IDL for vault-stake PRIME |
          | `idl/vault_stake_auto.json` | Anchor IDL for vault-stake AUTO (mainnet) |
          | `idl/vault_stake_auto_devnet.json` | Anchor IDL for vault-stake AUTO (devnet) |
          | `idl/vault_stake_smb.json` | Anchor IDL for vault-stake SMB |
          | `client/vault_mint.ts` | TypeScript types from the vault-mint IDL |
          | `client/vault_stake_prime.ts` | TypeScript types from the PRIME IDL |
          | `client/vault_stake_auto.ts` | TypeScript types from the mainnet AUTO IDL |
          | `client/vault_stake_auto_devnet.ts` | TypeScript types from the devnet AUTO IDL |
          | `client/vault_stake_smb.ts` | TypeScript types from the SMB IDL |

          All artifact hashes are in `checksums.txt`.

          ### Squads upgrade checklist

          1. Confirm buffer SHA-256 matches `checksums.txt` before approving. Use `programs/vault_stake_auto_devnet.so` for devnet AUTO and `programs/vault_stake_auto.so` for mainnet AUTO.
          2. Execute program upgrade in Squads.
          3. Import and execute the cluster-matching `verify/pda-msg-*` files in Squads v4 Transaction Builder.
          4. Run `solana-verify remote submit-job` per program.
