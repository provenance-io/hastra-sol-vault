[package]
name = "vault-mint"
version = "0.1.0"
description = "Solana Vault Mint Contract for Hastra"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
cpi = ["no-entrypoint"]
no-entrypoint = []
anchor-debug = []
no-idl = []
no-log-ix-name = []
# Localnet-only program IDs and test-only instructions; do not deploy to devnet/mainnet.
localnet-program-ids = []
testing = ["localnet-program-ids"]
custom-heap = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-panic = []

# Host builds (clippy -D warnings in CI) flag existing code and Anchor 0.31's generated code. They
# are allowed here rather than fixed so the program source, and its verified build, stay unchanged.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
deprecated = "allow"

[lints.clippy]
doc_lazy_continuation = "allow"
explicit_auto_deref = "allow"
needless_borrow = "allow"
redundant_field_names = "allow"
redundant_slicing = "allow"

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
bincode = "1.3.3"
hex = "0.4.3"
solana-security-txt = "1.1.3"
