[package]
name = "vault-mint"
version = "0.1.0"
description = "Solana Vault Mint Contract for Hastra"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
cpi = ["no-entrypoint"]
no-entrypoint = []
anchor-debug = []
no-idl = []
no-log-ix-name = []
# Localnet-only program IDs and test-only instructions; do not deploy to devnet/mainnet.
localnet-program-ids = []
testing = ["localnet-program-ids"]
custom-heap = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-panic = []

# Host builds (clippy, cargo test) see code generated by Anchor 0.31 that rustc flags but this crate
# cannot change: the entrypoint macros test `target_os = "solana"`, and the injected IDL
# instructions call the deprecated `AccountInfo::realloc`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
# Anchor 0.31's `#[program]` expansion calls the deprecated `AccountInfo::realloc` outside the
# annotated module, so an item-level allow cannot reach it.
deprecated = "allow"

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
bincode = "1.3.3"
hex = "0.4.3"
solana-security-txt = "1.1.3"
