[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/hastra-localnet-id.json"

[workspace]
members = ["programs/vault-stake", "programs/vault-mint"]

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 5000
upgradeable = true

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899

# Localnet uses the production program IDs. anchor test / anchor localnet load
# target/deploy/<lib>.so at genesis at each address below (upgradeable by the
# provider wallet, per [test] upgradeable), so no localnet keypairs are needed.
# Keys must be the snake_case library names; Anchor ignores entries that don't match.
# This section also stops Anchor's first build from rewriting declare_id!.
[programs.localnet]
vault_mint = "9WUyNREiPDMgwMh5Gt81Fd3JpiCKxpjZ5Dpq9Bo1RhMV"
vault_stake = "97V7JsExNC6yFWu5KjK1FLfVkNVvtMpAFL5QkLWKEGxY"

# Cluster address book for Anchor CLI / clients (does not select declare_id! at build time).
# Workspace builds: vault-mint + vault-stake only.
# vault-stake-auto / vault-stake-smb are the same vault-stake crate built with
# --features pool-auto (or pool-auto-devnet) / pool-smb — separate deployed program ids.
[programs.devnet]
vault-mint = "9WUyNREiPDMgwMh5Gt81Fd3JpiCKxpjZ5Dpq9Bo1RhMV"
vault-stake = "97V7JsExNC6yFWu5KjK1FLfVkNVvtMpAFL5QkLWKEGxY"
vault-stake-auto = "B8FDo5EGA2hZ7YMugcw8wPHUYDBQJfNkEYpduXFLHfdZ"
vault-stake-smb = "FtpEAgur3VALsDw91PfNre82eXVrtgiDNf9EG3JeBd2r"

[programs.mainnet]
vault-mint = "9WUyNREiPDMgwMh5Gt81Fd3JpiCKxpjZ5Dpq9Bo1RhMV"
vault-stake = "97V7JsExNC6yFWu5KjK1FLfVkNVvtMpAFL5QkLWKEGxY"
vault-stake-auto = "5uJgCDrQHfA58fPqLsuU14Srg9quxXNHz91cZ54cq4pK"
vault-stake-smb = "FtpEAgur3VALsDw91PfNre82eXVrtgiDNf9EG3JeBd2r"
